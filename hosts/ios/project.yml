name: Nativetron
# Generated by hosts/ios/build.sh into build/ios-project; $(NT_ROOT) is the repository root.
options:
  bundleIdPrefix: dev.nativetron
  deploymentTarget:
    iOS: "18.6"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    NT_ROOT: $(SRCROOT)/../..
targets:
  Nativetron:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../build/engine-assets
        type: folder
        buildPhase: resources
    info:
      path: ../../build/ios-project/Info.plist
      properties:
        CFBundleDisplayName: Nativetron
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nativetron.gpu
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(NT_IOS_TEAM)
        # scriptc static control library (ipc/control-profile.json), staged per SDK by
        # hosts/ios/build-control.sh. Simulator archives are arm64 only.
        SWIFT_OBJC_BRIDGING_HEADER: $(NT_ROOT)/hosts/ios/Sources/NativetronControl-Bridging.h
        HEADER_SEARCH_PATHS: $(NT_ROOT)/ipc
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(NT_ROOT)/build/ios-control/iphonesimulator
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(NT_ROOT)/build/ios-control/iphoneos
        OTHER_LDFLAGS: -lntcontrol
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        DEAD_CODE_STRIPPING: YES
